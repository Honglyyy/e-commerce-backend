services:
  mysql:
    image: mysql:latest
    container_name: order-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: order_service_db
    ports:
      - "3307:3306"
    volumes:
      - order-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  order-mysql-data: